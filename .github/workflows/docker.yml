name: docker

# push 到 main 或打 v* 标签时构建镜像，推到 GitHub 容器仓库（ghcr.io）
on:
  push:
    branches: [main]
    # 只改文档不重建镜像；后端或工作流本身变了才构建
    # 注意：没保留 tags 触发，因为 paths 过滤会让 tag 推送无法触发构建。
    # 回滚用 :sha-<7位> 标签，不需要版本号标签。
    paths:
      - 'server/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 用仓库自带的 GITHUB_TOKEN 推镜像，不需要额外配密钥
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（为了同时出 arm64 镜像）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
